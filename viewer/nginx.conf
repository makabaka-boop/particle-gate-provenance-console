server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 入口
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 计算请求在 Compose 网络内反代到 gates 服务。
    location /api/ {
        proxy_pass http://gates:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://gates:5000/healthz;
    }
}
